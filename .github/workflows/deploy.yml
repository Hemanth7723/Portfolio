name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'feature/*'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          target-folder: ${{ github.ref == 'refs/heads/main' && '.' || format('preview/{0}', github.ref_name) }}
